[project]
name = "rescueroute"
version = "0.1.0"
description = "RescueRoute – Multimodal AI platform for Bengaluru ambulance green-wave orchestration"
requires-python = ">=3.12,<3.14"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    # ORM / Database
    "sqlmodel>=0.0.21",
    "geoalchemy2>=0.15.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "alembic>=1.13.0",
    # HTTP client (Mappls API calls)
    "httpx>=0.27.0",
    # AI / Vision
    "ultralytics>=8.2.0",
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    # AI / Acoustics
    "librosa>=0.10.2",
    "tensorflow>=2.17.0",
    "tensorflow-hub>=0.16.0",
    "sounddevice>=0.4.7",
    # Utilities
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.3.0",
    "loguru>=0.7.2",
    "tenacity>=8.4.0",
    "shapely>=2.0",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]

[tool.hatch.build.targets.wheel]
packages = ["backend", "ai_engine"]

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
